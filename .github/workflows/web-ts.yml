# Managed by the dev template.
name: web-ts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Pick Node version (.nvmrc or LTS)
        run: |
          . .template/config
          dir="${WEB_TS_DIR:-.}"
          if [ -f "$dir/.nvmrc" ]; then echo "NODE_VERSION=$(cat "$dir/.nvmrc")" >> "$GITHUB_ENV"
          else echo "NODE_VERSION=lts/*" >> "$GITHUB_ENV"; fi
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable corepack (pnpm / yarn)
        run: corepack enable
      - run: ./scripts/check.sh --only web-ts
